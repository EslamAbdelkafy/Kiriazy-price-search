<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>البحث في قائمة الأسعار</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --green: #174f3b;
  --green-2: #22684d;
  --gold: #c9a45c;
  --ink: #1f2933;
  --muted: #687581;
  --line: #e3e9e5;
  --surface: #ffffff;
  --surface-2: #fbfcfb;
  --page: #f3f6f4;
  --soft: #edf4ef;
  --code-bg: #f1f5f2;
  --code-ink: #365646;
  --tag-bg: #f5f1e8;
  --tag-ink: #765d2d;
  --tag-border: #eee3cb;
  --bundle-bg: #eef7ff;
  --bundle-ink: #1d4ed8;
  --bundle-border: #bfdbfe;
  --shadow: 0 8px 28px rgba(24,55,39,.07);
}

[data-theme="dark"] {
  --green: #2ea87c;
  --green-2: #3bc493;
  --gold: #d4b26f;
  --ink: #e6edf3;
  --muted: #9ca8b4;
  --line: #2b353c;
  --surface: #182026;
  --surface-2: #12181d;
  --page: #0d1216;
  --soft: #1f3029;
  --code-bg: #222d35;
  --code-ink: #85d1b2;
  --tag-bg: #2d2618;
  --tag-ink: #e2c07d;
  --tag-border: #4a3e25;
  --bundle-bg: #17253b;
  --bundle-ink: #93c5fd;
  --bundle-border: #264069;
  --shadow: 0 8px 28px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;line-height:1.6;transition:background .2s,color .2s}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 110px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);transition:background .2s,border-color .2s}
.head{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;gap:20px;padding:24px 28px;border-top:4px solid var(--gold)}
.head:after{content:"";position:absolute;inset:auto -30px -72px auto;width:190px;height:190px;border:26px solid rgba(201,164,92,.08);border-radius:50%;pointer-events:none}
.head img{width:112px;height:76px;object-fit:contain;flex:0 0 auto;background:#fff;padding:6px;border-radius:12px}
.head .t{display:flex;flex-direction:column;gap:5px;flex:1 1 240px;min-width:0;position:relative;z-index:1}
h1{margin:0;font-size:clamp(22px,3vw,30px);line-height:1.35;font-weight:700;color:var(--green)}
.muted{font-size:14px;color:var(--muted)}
#taxnote{font-weight:600;color:var(--green-2)}

.theme-btn{background:var(--surface-2);color:var(--ink);border:1.5px solid var(--line);min-height:44px;padding:0 14px;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;z-index:2}
.theme-btn:hover{background:var(--soft);border-color:var(--green)}

.search-card{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.lbl{font-size:14px;font-weight:700;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;align-items:stretch}
input[type=search],input[type=number],select{font:inherit;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;transition:border-color .15s,box-shadow .15s,background .15s}
input[type=search]{flex:1 1 auto;min-width:0;height:56px;padding:0 18px;font-size:17px}
input::placeholder{color:var(--muted);opacity:.75}
:focus-visible{outline:3px solid rgba(201,164,92,.55);outline-offset:2px}
input[type=search]:focus,input[type=number]:focus,select:focus{border-color:var(--green-2);background:var(--surface)}

button,.btn{font:inherit;font-size:14px;font-weight:700;min-height:44px;padding:0 16px;border-radius:12px;cursor:pointer;color:#fff;background:var(--green);border:1px solid var(--green);display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .15s,transform .15s,border-color .15s}
button:hover{background:var(--green-2)}
button:active{transform:translateY(1px)}
#clear{min-width:74px;height:56px;color:var(--green);background:var(--surface);border-color:var(--line)}
#clear:hover{background:var(--soft)}
#clear[hidden]{display:none}

.adv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;padding-top:4px}
.adv-grid select,.adv-grid input{height:46px;padding:0 12px;font-size:14px;font-weight:600;width:100%}
.global-disc-wrap{display:flex;gap:6px}
.global-disc-wrap input{flex:1}
.global-disc-wrap select{width:82px;flex:0 0 auto}

.meta-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-top:4px;border-top:1px solid var(--line)}
#count{font-weight:700;color:var(--green);font-size:14px}

#list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 20px;transition:border-color .15s,box-shadow .15s}
.item:hover{border-color:var(--green);box-shadow:0 4px 16px rgba(0,0,0,.06)}
.item.is-bundle{border-right:4px solid var(--gold)}
.item .n{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:7px}
.item .name{font-size:16px;font-weight:700;line-height:1.6;overflow-wrap:anywhere}
.tags-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.item .c{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.code{direction:ltr;padding:3px 10px;border-radius:7px;background:var(--code-bg);color:var(--code-ink);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;font-weight:700;letter-spacing:.3px}
.tag{display:inline-flex;align-items:center;width:max-content;background:var(--tag-bg);color:var(--tag-ink);border:1px solid var(--tag-border);border-radius:7px;padding:2px 9px;font-size:12px;font-weight:700}
.tag.bundle-tag{background:var(--bundle-bg);color:var(--bundle-ink);border-color:var(--bundle-border)}

.item .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.price-col{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.price{display:flex;align-items:baseline;gap:6px;color:var(--green);white-space:nowrap;background:var(--soft);padding:7px 12px;border-radius:10px}
.price b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.price span{font-size:13px;font-weight:700}
.old-price{font-size:12px;color:var(--muted);text-decoration:line-through;padding-inline:4px}

.discount-box{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.discount-input{width:92px;min-width:0;height:38px;padding:0 9px;border-radius:9px;font-size:13px}
.discount-type{height:38px;padding:0 8px;font-size:13px;border-radius:9px}

.btn-outline{min-height:40px;padding:0 13px;font-size:13px;background:var(--surface);color:var(--green);border:1px solid var(--line);white-space:nowrap}
.btn-outline:hover{background:var(--soft);border-color:var(--green)}
.btn-quote{min-height:40px;padding:0 14px;font-size:13px;background:var(--green);color:#fff;border:1px solid var(--green);white-space:nowrap}
.btn-quote.in-cart{background:var(--gold);border-color:var(--gold);color:#1f2933}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:34px 20px;text-align:center;font-size:16px;color:var(--muted)}
#more-wrap{text-align:center;padding:5px 0 12px}
#more{min-width:190px;background:var(--surface);color:var(--green);border-color:var(--line)}
#more:hover{background:var(--soft)}
.footer-note{text-align:center;color:var(--muted);font-size:12px;padding-top:2px}

/* شريط عرض السعر العائم */
.quote-bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:1000px;background:var(--surface);border:2px solid var(--gold);border-radius:16px;padding:12px 20px;box-shadow:0 12px 34px rgba(0,0,0,.22);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;z-index:90}
.quote-bar[hidden]{display:none}
.quote-summary{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.quote-badge{background:var(--gold);color:#1f2933;font-weight:700;padding:4px 12px;border-radius:99px;font-size:14px}
.quote-total{font-size:18px;font-weight:700;color:var(--green)}
.quote-actions{display:flex;gap:8px;flex-wrap:wrap}

/* نافذة تفاصيل عرض السعر */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal-backdrop[hidden]{display:none}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:20px;width:100%;max-width:760px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.35);overflow:hidden}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-head h2{margin:0;font-size:20px;color:var(--green)}
.modal-body{padding:18px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.quote-table{width:100%;border-collapse:collapse;font-size:14px}
.quote-table th,.quote-table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right}
.quote-table th{color:var(--muted);font-weight:700;font-size:13px}
.qty-ctrl{display:inline-flex;align-items:center;gap:6px}
.qty-btn{min-height:28px;width:28px;padding:0;border-radius:7px;font-size:15px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.qty-btn:hover{background:var(--soft)}
.del-btn{background:transparent;color:#e11d48;border:none;min-height:28px;padding:0 6px;font-size:13px}
.del-btn:hover{background:rgba(225,29,72,.1)}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);background:var(--surface-2);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.wa-btn{background:#25D366;border-color:#25D366;color:#fff}
.wa-btn:hover{background:#1ebe5a}

@media(max-width:640px){
  .wrap{padding:14px 12px 120px;gap:13px}
  .head{padding:16px;gap:12px;border-radius:16px}
  .head img{width:78px;height:56px}
  .search-card{padding:16px 14px}
  .item{padding:14px;gap:12px}
  .item .n{flex-basis:100%}
  .item .actions{width:100%;justify-content:space-between}
  .quote-bar{padding:12px 14px;bottom:10px;width:calc(100% - 20px)}
  .quote-actions{width:100%}
  .quote-actions button{flex:1}
}

/* تنسيق خاص للطباعة PDF */
@media print {
  body{background:#fff;color:#000}
  .search-card,#list,#more-wrap,.footer-note,.quote-bar,.theme-btn,.modal-foot,.del-btn,.qty-btn,.close-modal-btn{display:none!important}
  .wrap{padding:0;max-width:100%}
  .modal-backdrop{position:static;background:none;padding:0;display:block!important}
  .modal{box-shadow:none;border:none;max-width:100%;max-height:none}
  .modal-head{border-bottom:2px solid #174f3b}
}
</style>
</head>

<script>
(function () {
  'use strict';
  var data = JSON.parse(document.getElementById('pricedata').textContent);
  var $ = function (id) { return document.getElementById(id); };
  var PAGE_SIZE = 80, visibleLimit = PAGE_SIZE, framePending = false;
  var taxRate = Number(data.taxRate) || 0;
  var formatter = new Intl.NumberFormat('en-US', {maximumFractionDigits:0});

  // 1. إدارة الوضع الليلي
  var savedTheme = localStorage.getItem('kp_theme') || 'light';
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    $('theme-toggle').textContent = t === 'dark' ? '☀️ الوضع النهاري' : '🌙 الوضع الليلي';
    localStorage.setItem('kp_theme', t);
  }
  applyTheme(savedTheme);
  $('theme-toggle').addEventListener('click', function () {
    var current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });

  function norm(s) {
    return String(s).toLowerCase()
      .replace(/[\u064B-\u065F\u0670\u0640]/g, '')
      .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
      .replace(/[٠-٩]/g, function (d) { return String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)); })
      .replace(/[۰-۹]/g, function (d) { return String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); })
      .replace(/\s+/g, ' ').trim();
  }

  function categoryFor(name) {
    var n = norm(name);
    if (/ديب فريزر|فريزر/.test(n)) return 'freezer';
    if (/غساله اطباق|غسالة اطباق|dishwasher/.test(n)) return 'dishwasher';
    if (/ثلاجه|ثلاجة/.test(n)) return 'fridge';
    if (/غساله|غسالة|هاف اتوماتيك|توب لودينج/.test(n)) return 'washer';
    if (/تكييف|وحده داخليه تكييف|وحده خارجيه تكييف|حامل تكييف/.test(n)) return 'ac';
    if (/بوتاجاز|فرن كرياز|فرن كهرباء|فرن 4 شعله|فرن 5 شعله|مسطح كهرباء|مسطح كريازي/.test(n)) return 'stove';
    if (/سخان/.test(n)) return 'waterheater';
    if (/مبرد مياه|مبردمياه|مبرد هواء/.test(n)) return 'cooler';
    if (/مروحه|مروحة/.test(n)) return 'fan';
    if (/مكنسه|مكنسة/.test(n)) return 'vacuum';
    return 'other';
  }

  // توسيع حساب القدم ليشمل كل الثلاجات والديب فريزر تلقائياً
  function calcFeet(name, cat) {
    var n = norm(name);
    if (cat !== 'fridge' && cat !== 'freezer') return '';
    if (/لؤلؤه/.test(n)) return '20 قدم';
    if (/فيروزه/.test(n)) return '18 قدم';
    if (/زمرده/.test(n)) return '16 قدم';
    if (/سولتير|برلنت/.test(n)) return '14 قدم';
    if (/12 قدم/.test(n)) return '12 قدم';
    var m = n.match(/(\d{3})\s*لتر/);
    if (m) {
      var liters = parseInt(m[1], 10);
      if (liters >= 650) return '25 قدم';
      if (liters >= 600) return '22 قدم';
      if (liters >= 520) return '20 قدم';
      if (liters >= 470) return '18 قدم';
      if (liters >= 410) return '16 قدم';
      if (liters >= 360) return '14 قدم';
      if (liters >= 310) return '12 قدم';
      if (liters >= 260) return '10 قدم';
      return Math.round(liters / 28.3) + ' قدم';
    }
    return '';
  }

  // 2. توليد أطقم التكييفات الكاملة تلقائياً (دمج الوحدة الداخلية + الخارجية)
  var rawItems = data.items.slice();
  var acGroups = {};
  rawItems.forEach(function (it) {
    var code = it[0], name = it[1], price = Number(it[2]);
    var match = name.match(/(KAC\d+[A-Z]+)\/([IO])\/([A-Z0-9]+)/i);
    if (match) {
      var modelKey = (match[1] + '/' + match[3]).toUpperCase().replace(/0/g, 'O');
      if (!acGroups[modelKey]) acGroups[modelKey] = {};
      if (match[2].toUpperCase() === 'O') acGroups[modelKey].outdoor = {code: code, name: name, price: price};
      if (match[2].toUpperCase() === 'I') acGroups[modelKey].indoor = {code: code, name: name, price: price};
    }
  });

  var bundledACs = [];
  Object.keys(acGroups).forEach(function (k) {
    var g = acGroups[k];
    if (g.indoor && g.outdoor) {
      var cleanDesc = g.indoor.name
        .replace(/وحدة داخلية|وحده داخليه|حائطى|حائطي/g, '')
        .replace(/KAC\S+/i, '')
        .replace(/\s+/g, ' ').trim();
      var modelCode = g.indoor.name.match(/KAC\S+/i)[0].replace('/I/', '/SET/');
      bundledACs.push([
        g.outdoor.code + '+' + g.indoor.code,
        'تكييف كامل (وحدة داخلية + خارجية) ' + cleanDesc + ' ' + modelCode,
        g.outdoor.price + g.indoor.price,
        true // isBundle flag
      ]);
    }
  });

  var allCombined = bundledACs.concat(rawItems);

  var INDEX = allCombined.map(function (it, order) {
    var isBundle = Boolean(it[3]);
    var cat = isBundle ? 'ac_bundle' : categoryFor(it[1]);
    var feet = calcFeet(it[1], cat);
    var code = norm(it[0]), name = norm(it[1]);
    var extra = feet ? ' ' + feet : '';
    var hay = norm(code + ' ' + name + ' ' + cat + ' ' + extra);
    var basePrice = Math.round(Number(it[2]) * (1 + taxRate / 100));
    return {
      code: it[0], name: it[1], price: Number(it[2]), basePrice: basePrice,
      order: order, codeNorm: code, nameNorm: name, hay: hay,
      flat: hay.replace(/\s/g, ''), category: cat, feet: feet, isBundle: isBundle,
      customDiscVal: '', customDiscType: 'percent'
    };
  });

  $('taxnote').textContent = 'الأسعار شاملة ضريبة ' + taxRate + '% ومقرّبة لأقرب جنيه';

  function computeFinalPrice(it) {
    var p = it.basePrice;
    // تطبيق الخصم العام أولاً
    var gVal = Number($('global-disc').value);
    var gType = $('global-disc-type').value;
    if (Number.isFinite(gVal) && gVal > 0) {
      p = gType === 'percent' ? Math.round(p * (1 - Math.min(gVal, 100) / 100)) : Math.max(0, Math.round(p - gVal));
    }
    // تطبيق الخصم الفردي الخاص بالمنتج إن وجد
    var cVal = Number(it.customDiscVal);
    if (Number.isFinite(cVal) && cVal > 0) {
      p = it.customDiscType === 'percent' ? Math.round(p * (1 - Math.min(cVal, 100) / 100)) : Math.max(0, Math.round(p - cVal));
    }
    return p;
  }

  // إدارة سلة عرض الأسعار
  var QUOTE = {}; // code -> {item, qty}

  function updateQuoteUI() {
    var keys = Object.keys(QUOTE);
    var bar = $('quote-bar');
    if (!keys.length) {
      bar.hidden = true;
      $('quote-modal').hidden = true;
      return;
    }
    bar.hidden = false;
    var totalItems = 0, totalPrice = 0;
    var tbody = $('quote-tbody');
    tbody.innerHTML = '';

    keys.forEach(function (code) {
      var entry = QUOTE[code];
      var unitPrice = computeFinalPrice(entry.item);
      var sub = unitPrice * entry.qty;
      totalItems += entry.qty;
      totalPrice += sub;

      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td><b>' + entry.item.name + '</b><br><span class="muted" style="font-size:12px">كود: ' + entry.item.code + '</span></td>' +
        '<td>' + formatter.format(unitPrice) + ' ج</td>' +
        '<td><div class="qty-ctrl">' +
          '<button type="button" class="qty-btn" data-act="dec" data-code="' + code + '">-</button>' +
          '<b>' + entry.qty + '</b>' +
          '<button type="button" class="qty-btn" data-act="inc" data-code="' + code + '">+</button>' +
        '</div></td>' +
        '<td><b>' + formatter.format(sub) + ' ج</b></td>' +
        '<td><button type="button" class="del-btn" data-act="del" data-code="' + code + '">حذف</button></td>';
      tbody.appendChild(tr);
    });

    $('quote-count').textContent = totalItems + ' قطعة (' + keys.length + ' صنف)';
    $('quote-total').textContent = formatter.format(totalPrice) + ' جنيه';
    $('modal-total').textContent = formatter.format(totalPrice) + ' جنيه';
  }

  $('quote-tbody').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var code = btn.getAttribute('data-code');
    var act = btn.getAttribute('data-act');
    if (!QUOTE[code]) return;
    if (act === 'inc') QUOTE[code].qty++;
    if (act === 'dec') {
      QUOTE[code].qty--;
      if (QUOTE[code].qty <= 0) delete QUOTE[code];
    }
    if (act === 'del') delete QUOTE[code];
    updateQuoteUI();
    scheduleRender(false);
  });

  function formatQuoteText() {
    var lines = ['📋 *عرض سعر أجهزة كريازي*', 'بتاريخ: ' + new Date().toLocaleDateString('ar-EG'), '------------------------'];
    var total = 0;
    Object.keys(QUOTE).forEach(function (code, idx) {
      var entry = QUOTE[code];
      var uPrice = computeFinalPrice(entry.item);
      var sub = uPrice * entry.qty;
      total += sub;
      lines.push((idx + 1) + '. ' + entry.item.name);
      lines.push('   الكود: ' + entry.item.code + ' | الكمية: ' + entry.qty + ' | السعر: ' + formatter.format(sub) + ' جنيه');
    });
    lines.push('------------------------');
    lines.push('💰 *الإجمالي النهائي: ' + formatter.format(total) + ' جنيه* (شامل الضريبة)');
    return lines.join('\n');
  }

  $('open-quote').addEventListener('click', function () { $('quote-modal').hidden = false; });
  $('close-modal').addEventListener('click', function () { $('quote-modal').hidden = true; });
  $('clear-quote').addEventListener('click', function () { QUOTE = {}; updateQuoteUI(); scheduleRender(false); });
  $('print-quote').addEventListener('click', function () { window.print(); });
  $('wa-quote').addEventListener('click', function () {
    var txt = formatQuoteText();
    window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
  });
  $('copy-quote-all').addEventListener('click', function () {
    var btn = $('copy-quote-all');
    navigator.clipboard.writeText(formatQuoteText()).then(function () {
      btn.textContent = 'تم النسخ ✓';
      setTimeout(function () { btn.textContent = 'نسخ النص'; }, 1600);
    });
  });

  function findMatches() {
    var query = $('q').value;
    var category = $('category').value;
    var sortBy = $('sort').value;
    var maxPrice = Number($('max-price').value) || 0;
    var tokens = norm(query).split(' ').filter(Boolean);
    var results = [];

    for (var i = 0; i < INDEX.length; i++) {
      var it = INDEX[i];
      if (category !== 'all') {
        if (category === 'ac') {
          if (it.category !== 'ac' && it.category !== 'ac_bundle') continue;
        } else if (it.category !== category) continue;
      }
      var finalP = computeFinalPrice(it);
      if (maxPrice > 0 && finalP > maxPrice) continue;

      var ok = true;
      for (var j = 0; j < tokens.length; j++) {
        if (it.hay.indexOf(tokens[j]) === -1 && it.flat.indexOf(tokens[j]) === -1) { ok = false; break; }
      }
      if (ok) results.push(it);
    }

    if (sortBy === 'price_asc') {
      results.sort(function (a, b) { return computeFinalPrice(a) - computeFinalPrice(b); });
    } else if (sortBy === 'price_desc') {
      results.sort(function (a, b) { return computeFinalPrice(b) - computeFinalPrice(a); });
    } else if (tokens.length) {
      var q = norm(query);
      results.sort(function (a, b) {
        function score(it) {
          if (it.codeNorm === q) return 0;
          if (it.isBundle) return 1;
          if (it.nameNorm === q) return 2;
          if (it.codeNorm.indexOf(q) === 0) return 3;
          return 4;
        }
        return score(a) - score(b) || a.order - b.order;
      });
    }
    return results;
  }

  function copySingleText(it, finalPrice) {
    return 'اسم المنتج: ' + it.name + '\nكود المنتج: ' + it.code + '\nالسعر: ' + formatter.format(finalPrice) + ' جنيه';
  }

  function addItem(frag, it) {
    var row = document.createElement('article');
    row.className = 'item' + (it.isBundle ? ' is-bundle' : '');
    var n = document.createElement('div');
    n.className = 'n';

    var name = document.createElement('div');
    name.className = 'name';
    name.textContent = it.name;
    n.appendChild(name);

    var tagsRow = document.createElement('div');
    tagsRow.className = 'tags-row';
    if (it.isBundle) {
      var bTag = document.createElement('span');
      bTag.className = 'tag bundle-tag';
      bTag.textContent = '❄️ طقم كامل (داخلي + خارجي)';
      tagsRow.appendChild(bTag);
    }
    if (it.feet) {
      var fTag = document.createElement('span');
      fTag.className = 'tag';
      fTag.textContent = 'السعة التقريبية: ' + it.feet;
      tagsRow.appendChild(fTag);
    }
    if (tagsRow.childNodes.length) n.appendChild(tagsRow);

    var c = document.createElement('div');
    c.className = 'c';
    var l1 = document.createElement('span');
    l1.textContent = 'كود المنتج';
    var code = document.createElement('span');
    code.className = 'code';
    code.textContent = it.code;
    c.appendChild(l1);
    c.appendChild(code);
    n.appendChild(c);
    row.appendChild(n);

    var actions = document.createElement('div');
    actions.className = 'actions';

    var priceCol = document.createElement('div');
    priceCol.className = 'price-col';
    var finalP = computeFinalPrice(it);
    var price = document.createElement('div');
    price.className = 'price';
    var b = document.createElement('b');
    b.textContent = formatter.format(finalP);
    var u = document.createElement('span');
    u.textContent = 'جنيه';
    price.appendChild(b);
    price.appendChild(u);
    priceCol.appendChild(price);

    var oldPrice = document.createElement('span');
    oldPrice.className = 'old-price';
    oldPrice.textContent = 'قبل الخصم: ' + formatter.format(it.basePrice) + ' ج';
    oldPrice.hidden = finalP === it.basePrice;
    priceCol.appendChild(oldPrice);
    actions.appendChild(priceCol);

    // خصم فردي إضافي
    var discountBox = document.createElement('div');
    discountBox.className = 'discount-box';
    var discountInput = document.createElement('input');
    discountInput.type = 'number';
    discountInput.min = '0';
    discountInput.step = 'any';
    discountInput.placeholder = 'خصم خاص';
    discountInput.className = 'discount-input';
    discountInput.value = it.customDiscVal;

    var discountType = document.createElement('select');
    discountType.className = 'discount-type';
    discountType.innerHTML = '<option value="percent">%</option><option value="cash">ج</option>';
    discountType.value = it.customDiscType;

    function updateItemPrice() {
      it.customDiscVal = discountInput.value;
      it.customDiscType = discountType.value;
      var newP = computeFinalPrice(it);
      b.textContent = formatter.format(newP);
      oldPrice.hidden = newP === it.basePrice;
      if (QUOTE[it.code]) updateQuoteUI();
    }
    discountInput.addEventListener('input', updateItemPrice);
    discountType.addEventListener('change', updateItemPrice);
    discountBox.appendChild(discountInput);
    discountBox.appendChild(discountType);
    actions.appendChild(discountBox);

    // زر إضافة لعرض السعر
    var qBtn = document.createElement('button');
    qBtn.type = 'button';
    var inCartQty = QUOTE[it.code] ? QUOTE[it.code].qty : 0;
    qBtn.className = 'btn-quote' + (inCartQty ? ' in-cart' : '');
    qBtn.textContent = inCartQty ? 'في العرض (' + inCartQty + ') +' : '+ عرض سعر';
    qBtn.addEventListener('click', function () {
      if (!QUOTE[it.code]) QUOTE[it.code] = {item: it, qty: 1};
      else QUOTE[it.code].qty++;
      var q = QUOTE[it.code].qty;
      qBtn.className = 'btn-quote in-cart';
      qBtn.textContent = 'في العرض (' + q + ') +';
      updateQuoteUI();
    });
    actions.appendChild(qBtn);

    // زر نسخ منفرد
    var copy = document.createElement('button');
    copy.type = 'button';
    copy.className = 'btn-outline';
    copy.textContent = 'نسخ';
    copy.addEventListener('click', function () {
      var txt = copySingleText(it, computeFinalPrice(it));
      navigator.clipboard.writeText(txt).then(function () {
        copy.textContent = 'تم ✓';
        setTimeout(function () { copy.textContent = 'نسخ'; }, 1500);
      });
    });
    actions.appendChild(copy);

    row.appendChild(actions);
    frag.appendChild(row);
  }

  function render() {
    framePending = false;
    var query = $('q').value;
    var found = findMatches();
    var list = $('list'), frag = document.createDocumentFragment();
    var shown = Math.min(found.length, visibleLimit);
    for (var i = 0; i < shown; i++) addItem(frag, found[i]);

    if (!found.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'لا توجد نتائج مطابقة للبحث أو الميزانية المحددة.';
      frag.appendChild(empty);
    }
    list.replaceChildren(frag);
    $('clear').hidden = !query.length;
    $('count').textContent = 'عدد النتائج: ' + found.length + (shown < found.length ? ' — المعروض ' + shown : '');
    $('more-wrap').hidden = shown >= found.length;
    $('more').textContent = 'عرض المزيد (' + (found.length - shown) + ')';
    updateQuoteUI();
  }

  function scheduleRender(reset) {
    if (reset) visibleLimit = PAGE_SIZE;
    if (framePending) return;
    framePending = true;
    window.requestAnimationFrame(render);
  }

  ['q', 'category', 'sort', 'max-price', 'global-disc', 'global-disc-type'].forEach(function (id) {
    $(id).addEventListener('input', function () { scheduleRender(true); });
    $(id).addEventListener('change', function () { scheduleRender(true); });
  });

  $('clear').addEventListener('click', function () {
    $('q').value = '';
    scheduleRender(true);
    $('q').focus();
  });
  $('more').addEventListener('click', function () {
    visibleLimit += PAGE_SIZE;
    scheduleRender(false);
  });

  render();
})();
</script>
</body>
</html>
