<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>البحث في قائمة الأسعار</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f1e8;color:#1d2a1e;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;line-height:1.5}
.wrap{max-width:880px;margin:0 auto;padding:32px 20px 56px;display:flex;flex-direction:column;gap:20px}
.card{background:#fff;border:1px solid #e4dfd0;border-radius:16px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:20px;padding:20px 24px}
.head img{width:124px;height:78px;object-fit:contain}
.head .t{display:flex;flex-direction:column;gap:6px;flex:1 1 260px;min-width:0}
h1{margin:0;font-size:30px;line-height:1.3;font-weight:700;color:#205c22}
.muted{font-size:16px;color:#4a5247}
label.lbl{font-size:17px;font-weight:600}
.row{display:flex;gap:10px;align-items:stretch}
input[type=search]{flex:1 1 auto;min-width:0;height:56px;padding:0 18px;font:inherit;font-size:20px;color:#1d2a1e;background:#fff;border:2px solid #cfc8b2;border-radius:12px}
input::placeholder{color:#6b7466}
:focus-visible{outline:3px solid #cca250;outline-offset:2px}
input[type=search]:focus{border-color:#205c22}
button,.btn{font:inherit;font-size:18px;font-weight:600;min-height:48px;padding:0 18px;border-radius:12px;cursor:pointer;color:#205c22;background:#fff;border:2px solid #205c22;display:inline-flex;align-items:center;justify-content:center}
#clear{min-width:76px;height:56px}
#clear[hidden]{display:none}
.meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:16px;cursor:pointer}
.chk input{width:22px;height:22px;margin:0;accent-color:#205c22}
#list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;background:#fff;border:1px solid #e4dfd0;border-radius:12px;padding:16px 20px}
.item .n{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:8px}
.item .name{font-size:18px;font-weight:600;line-height:1.5}
.item .c{display:flex;align-items:center;gap:8px;font-size:14px;color:#4a5247}
.code{direction:ltr;padding:2px 10px;border-radius:999px;background:#f1ead6;color:#5a4510;font-size:15px;font-weight:600;letter-spacing:.5px}
.price{display:flex;align-items:baseline;gap:6px;color:#205c22}
.price b{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.price span{font-size:15px;font-weight:600}
.noprice{font-size:16px;font-weight:600;color:#6b4a10;background:#f7ecd2;border-radius:8px;padding:6px 12px}
.empty{background:#fff;border:1px dashed #cfc8b2;border-radius:12px;padding:32px 20px;text-align:center;font-size:18px;color:#4a5247}
.hidden-note{background:#f7ecd2;border-radius:12px;padding:14px 20px;font-size:16px;color:#5a3d08}
</style>
</head>

<script>
(function () {
  'use strict';
  var data = JSON.parse(document.getElementById('pricedata').textContent);
  var $ = function (id) { return document.getElementById(id); };
  var DIGITS = '٠١٢٣٤٥٦٧٨٩';

  function norm(s) {
    return String(s).toLowerCase()
      .replace(/[\u064B-\u065F\u0670\u0640]/g, '')
      .replace(/[أإآٱ]/g, 'ا')
      .replace(/ى/g, 'ي')
      .replace(/ة/g, 'ه')
      .replace(/استيل/g, 'ستيل')
      .replace(/[٠-٩]/g, function (d) { return String(DIGITS.indexOf(d)); })
      .replace(/\s+/g, ' ')
      .trim();
  }
  function spaced(t) {
    return t.replace(/(\d)([^\d\s.,])/g, '$1 $2').replace(/([^\d\s.,])(\d)/g, '$1 $2').replace(/\s+/g, ' ');
  }

  var INDEX = data.items.map(function (it) {
    var sp = spaced(norm(it[0] + ' ' + it[1]));
    return { code: it[0], name: it[1], price: it[2], hay: sp, flat: sp.replace(/ /g, '') };
  });

  function render() {
    var rate = Number(data.taxRate);
    var tokens = norm($('q').value).split(' ').filter(Boolean);
    var showUnp = $('unp').checked;
    var matched = INDEX.filter(function (it) {
      return tokens.every(function (t) { return it.hay.indexOf(t) !== -1 || it.flat.indexOf(t) !== -1; });
    });
    var found = showUnp ? matched : matched.filter(function (it) { return it.price > 0; });
    var hidden = matched.length - found.length;

    $('taxnote').textContent = 'الأسعار شاملة ضريبة ' + rate + '% ومقرّبة لأقرب جنيه';
    $('clear').hidden = tokens.length === 0;
    $('count').textContent = (tokens.length ? 'عدد النتائج: ' : 'كل الأصناف: ') + found.length;

    var list = $('list');
    while (list.firstChild) list.removeChild(list.firstChild);
    var frag = document.createDocumentFragment();
    found.forEach(function (it) {
      var row = document.createElement('div'); row.className = 'item';
      var n = document.createElement('div'); n.className = 'n';
      var name = document.createElement('div'); name.className = 'name'; name.textContent = it.name;
      var c = document.createElement('div'); c.className = 'c';
      var l1 = document.createElement('span'); l1.textContent = 'الكود';
      var code = document.createElement('span'); code.className = 'code'; code.textContent = it.code;
      c.appendChild(l1); c.appendChild(code);
      n.appendChild(name); n.appendChild(c);
      row.appendChild(n);
      if (it.price > 0) {
        var p = document.createElement('div'); p.className = 'price';
        var b = document.createElement('b'); b.textContent = Math.round(it.price * (1 + rate / 100)).toLocaleString('en-US');
        var u = document.createElement('span'); u.textContent = 'جنيه';
        p.appendChild(b); p.appendChild(u); row.appendChild(p);
      } else {
        var np = document.createElement('div'); np.className = 'noprice'; np.textContent = 'السعر غير محدد في القائمة';
        row.appendChild(np);
      }
      frag.appendChild(row);
    });
    list.appendChild(frag);
    if (found.length === 0) {
      var e = document.createElement('div'); e.className = 'empty';
      e.textContent = 'لا توجد نتائج. جرّب كلمة أخرى أو جزءًا من الكود.';
      list.appendChild(e);
    }
    if (hidden > 0) {
      var h = document.createElement('div'); h.className = 'hidden-note';
      h.textContent = 'يوجد ' + hidden + ' صنف مطابق بدون سعر في القائمة. فعّل "إظهار الأصناف غير المسعّرة" لعرضها.';
      list.appendChild(h);
    }
  }

  $('q').addEventListener('input', render);
  $('unp').addEventListener('change', render);
  $('clear').addEventListener('click', function () { $('q').value = ''; render(); $('q').focus(); });
  render();
})();
</script>
